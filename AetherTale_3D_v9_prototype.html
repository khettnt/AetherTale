 ell(leg,ivory,0,-.30,0,.18,.38,.19);
 ell(leg,navy,0,-.66,.02,.19,.25,.21);

const stick=document.getElementById('stick'),nub=document.getElementById('nub');function moveStick(e){const r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.hypot(dx,dy),k=Math.min(1,44/(len||1));stickX=dx*k/44;stickY=dy*k/44;nub.style.transform=`translate(${dx*k}px,${dy*k}px)`}stick.onpointerdown=e=>{stick.setPointerCapture(e.pointerId);manual=true;moveStick(e)};stick.onpointermove=e=>{if(manual)moveStick(e)};function stopStick(){manual=false;stickX=stickY=0;nub.style.transform=''}stick.onpointerup=stopStick;stick.onpointercancel=stopStick;

function turnToward(dx,dz,dt,speed=12){
 if(Math.hypot(dx,dz)<0.001)return;

 const delta=Math.atan2(Math.sin(target-hero.rotation.y),Math.cos(target-hero.rotation.y));
