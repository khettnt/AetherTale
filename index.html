<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>AetherTale Prototype</title><style>html,body{margin:0;overflow:hidden;background:#192d40;color:white;font-family:system-ui}canvas{display:block;width:100vw;height:100dvh;touch-action:none}button{position:absolute;border:1px solid #fff8;background:#173e6bdc;color:white;border-radius:18px;padding:12px;font-weight:700}#auto{right:12px;bottom:90px}#hit{right:12px;bottom:22px;background:#a34250e8}#plus{right:105px;bottom:22px}#joy{left:20px;bottom:22px;width:105px;height:105px;border-radius:50%;background:#ffffff33;touch-action:none}#nub{width:42px;height:42px;border-radius:50%;background:#fff9;position:absolute;left:31px;top:31px}#help{position:absolute;top:8px;left:10px;font-size:12px;text-shadow:1px 1px #000}</style></head><body><canvas id="c"></canvas><div id="help">AetherTale • PLAYABLE CONCEPT • WASD / ปุ่มวงกลมเดิน • Space โจมตี</div><div id="joy"><div id="nub"></div></div><button id="auto">AUTO OFF</button><button id="plus">อาวุธ +15</button><button id="hit">โจมตี ⚔</button><script>
const c=document.getElementById('c'),ctx=c.getContext('2d');let W,H,scale;function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;scale=Math.min(W/900,H/550);ctx.setTransform(1,0,0,1,0,0)}addEventListener('resize',resize);resize();
const p={x:0,y:0,hp:100,exp:0,level:1,weapon:15,face:1};let auto=false,slash=0,particles=[],kills=0,t=0;
let mobs=[{x:2.5,y:1.2,hp:3,alive:true,resp:0},{x:-3,y:1.5,hp:3,alive:true,resp:0},{x:3,y:-2,hp:3,alive:true,resp:0},{x:-2,y:-3,hp:3,alive:true,resp:0}];
let keys={},joy={x:0,y:0};onkeydown=e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){attack();e.preventDefault()}};onkeyup=e=>keys[e.key.toLowerCase()]=false;
const j=document.getElementById('joy'),nub=document.getElementById('nub');function stick(e){let r=j.getBoundingClientRect(),dx=(e.clientX-r.left-r.width/2)/(r.width/2),dy=(e.clientY-r.top-r.height/2)/(r.height/2),d=Math.max(1,Math.hypot(dx,dy));joy.x=dx/d;joy.y=dy/d;nub.style.transform=`translate(${joy.x*28}px,${joy.y*28}px)`}j.onpointerdown=e=>{j.setPointerCapture(e.pointerId);stick(e)};j.onpointermove=e=>{if(e.buttons)stick(e)};j.onpointerup=()=>{joy={x:0,y:0};nub.style.transform=''};document.getElementById('auto').onclick=()=>{auto=!auto;document.getElementById('auto').textContent='AUTO '+(auto?'ON':'OFF')};document.getElementById('hit').onclick=attack;document.getElementById('plus').onclick=()=>{p.weapon=p.weapon===15?10:p.weapon+1;document.getElementById('plus').textContent='อาวุธ +'+p.weapon};
function iso(x,y,z=0){let u=(x-y)*43*scale,v=(x+y)*23*scale-z*scale;return [W*.5+u,H*.51+v]}function poly(points,fill,stroke){ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function ellipse(x,y,rx,ry,color){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);ctx.fillStyle=color;ctx.fill()}
function sprite(x,y,kind='hero',hp=0){let [sx,sy]=iso(x,y);ctx.save();ctx.translate(sx,sy);ctx.scale(scale,scale);ellipse(0,4,18,7,'#172b3970');if(kind==='hero'){ctx.fillStyle='#f5c68d';ctx.beginPath();ctx.arc(0,-28,12,0,7);ctx.fill();ctx.fillStyle='#5e3d2f';ctx.beginPath();ctx.arc(0,-34,12,Math.PI,6.2);ctx.fill();ctx.fillStyle='#426dc0';ctx.fillRect(-10,-18,20,18);ctx.fillStyle='#283954';ctx.fillRect(-9,0,7,9);ctx.fillRect(3,0,7,9);let colors={10:'#63c9ff',11:'#35e5ad',12:'#a978ff',13:'#ffda54',14:'#ff6247',15:'#f5aaff'},color=colors[p.weapon];ctx.shadowBlur=22+8*Math.sin(t*.07);ctx.shadowColor=color;ctx.strokeStyle=color;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(13,-13);ctx.lineTo(29,-44);ctx.stroke();ctx.shadowBlur=0;ctx.strokeStyle='#f7f8ff';ctx.lineWidth=2;ctx.stroke();if(slash>0){ctx.strokeStyle=color;ctx.lineWidth=5;ctx.beginPath();ctx.arc(5,-25,31,-1.5,1);ctx.stroke()}}else{ctx.fillStyle='#92d963';ctx.beginPath();ctx.ellipse(0,-13,17,15,0,0,7);ctx.fill();ctx.fillStyle='#e6ffb1';ellipse(-5,-16,3,4,'#263f29');ellipse(6,-16,3,4,'#263f29');ctx.fillStyle='#e7a1a1';ctx.fillRect(-15,-33,30*hp/3,3)}ctx.restore()}
function tree(x,y){let [sx,sy]=iso(x,y);ctx.save();ctx.translate(sx,sy);ctx.scale(scale,scale);ctx.fillStyle='#795436';ctx.fillRect(-4,-35,8,38);for(let k=0;k<3;k++){ellipse(0,-45-k*12,27-k*4,15,'#267e58')}ctx.restore()}
function house(x,y){let a=iso(x,y),s=scale;ctx.save();ctx.translate(...a);ctx.scale(s,s);poly([[-50,0],[0,26],[52,0],[0,-26]],'#c9a46b');poly([[-50,-43],[0,-16],[0,26],[-50,0]],'#e6c58c');poly([[0,-16],[52,-43],[52,0],[0,26]],'#b98d65');poly([[-60,-43],[0,-78],[60,-43],[0,-9]],'#a44e59','#e8a5a2');ctx.fillStyle='#614531';ctx.fillRect(12,-10,15,22);ctx.restore()}
function attack(){slash=12;let m=mobs.filter(m=>m.alive).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))[0];if(m&&Math.hypot(m.x-p.x,m.y-p.y)<1.9){m.hp--;for(let i=0;i<9;i++)particles.push({x:m.x,y:m.y,z:30,vx:(Math.random()-.5)*.09,vy:(Math.random()-.5)*.09,vz:Math.random()*2+1,life:28});if(m.hp<=0){m.alive=false;m.resp=170;kills++;p.exp+=25;if(p.exp>=100){p.exp=0;p.level++}}}}
function loop(){t++;ctx.clearRect(0,0,W,H);let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x,dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joy.y;
if(auto){let m=mobs.filter(m=>m.alive).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))[0];if(m){let vx=m.x-p.x,vy=m.y-p.y,d=Math.hypot(vx,vy);if(d>1.3){dx=vx/d;dy=vy/d}else if(t%35===0)attack()}}
let norm=Math.max(1,Math.hypot(dx,dy));p.x=Math.max(-5,Math.min(5,p.x+dx/norm*.045));p.y=Math.max(-5,Math.min(5,p.y+dy/norm*.045));if(dx)p.face=Math.sign(dx);if(slash)slash--;
for(let x=-7;x<=7;x++)for(let y=-7;y<=7;y++){let a=iso(x,y),b=iso(x+1,y),d=iso(x+1,y+1),e=iso(x,y+1);poly([a,b,d,e],(x+y)%2?'#79b77c':'#82c183','#5d9f6a55')}
let objects=[{x:-4,y:-3,draw:()=>house(-4,-3)},{x:4,y:-4,draw:()=>house(4,-4)},...[[4,3],[-4,2],[-2,-5],[1,-5],[5,0]].map(([x,y])=>({x,y,draw:()=>tree(x,y)})),...mobs.filter(m=>m.alive).map(m=>({x:m.x,y:m.y,draw:()=>sprite(m.x,m.y,'mob',m.hp)})),{x:p.x,y:p.y,draw:()=>sprite(p.x,p.y)}];objects.sort((a,b)=>(a.x+a.y)-(b.x+b.y)).forEach(o=>o.draw());
for(let m of mobs)if(!m.alive&&--m.resp<=0){m.alive=true;m.hp=3;m.x=Math.random()*8-4;m.y=Math.random()*8-4}
particles=particles.filter(a=>a.life-->0);for(let a of particles){a.x+=a.vx;a.y+=a.vy;a.z+=a.vz;a.vz-=.15;let [x,y]=iso(a.x,a.y,a.z);ellipse(x,y,3*scale,3*scale,'#ffeb73')}
ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#10283fca';ctx.fillRect(8*devicePixelRatio,32*devicePixelRatio,185*devicePixelRatio,60*devicePixelRatio);ctx.fillStyle='white';ctx.font=`${14*devicePixelRatio}px system-ui`;ctx.fillText(`LV ${p.level}  HP ${p.hp}/100`,16*devicePixelRatio,53*devicePixelRatio);ctx.fillText(`EXP ${p.exp}/100   KO ${kills}`,16*devicePixelRatio,75*devicePixelRatio);requestAnimationFrame(loop)}loop();
</script></body></html>
