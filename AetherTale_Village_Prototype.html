<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>AetherTale Village</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#b8d7ad;font-family:system-ui}canvas{display:block;width:100%;height:100%;touch-action:none}#ui{position:fixed;top:env(safe-area-inset-top,12px);left:12px;background:#fffbe8df;padding:10px 14px;border-radius:14px;color:#4c583b;box-shadow:0 3px 12px #0002;font-size:13px}#ui b{font-size:17px}#reset{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 15px);right:14px;background:#fff7d9;border:1px solid #bdad7d;border-radius:12px;padding:12px;font-size:14px}</style><canvas id="c"></canvas><div id="ui"><b>AetherTale · หมู่บ้านต้นลม</b><div>แตะพื้นเพื่อเดิน • ฉากทดลองออฟไลน์</div><div id="status">กำลังสำรวจหมู่บ้าน</div></div><button id="reset">กลับกลางหมู่บ้าน</button><script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),status=document.getElementById('status');let W,H,dpr,scale,ox,oy;const N=15,T=46;let hero={x:7,y:8,tx:7,ty:8},t=0;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);scale=Math.min(W/(N*T*.92),H/(N*T*.55+160),1.4);ox=W/2;oy=H*.19}addEventListener('resize',resize);resize();
function pos(x,y,z=0){return [ox+(x-y)*T*scale*.5,oy+(x+y)*T*scale*.255-z*scale]}
function poly(points,fill,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.2*scale;ctx.stroke()}}
function diamond(x,y,col){poly([pos(x,y),pos(x+1,y),pos(x+1,y+1),pos(x,y+1)],col,'#76985a33')}
function ellipse(x,y,rx,ry,col){ctx.beginPath();ctx.ellipse(x,y,rx*scale,ry*scale,0,0,Math.PI*2);ctx.fillStyle=col;ctx.fill()}
function house(x,y,roof='#c46d4e'){let a=pos(x,y,0),b=pos(x+2,y,0),d=pos(x,y+2,0),e=pos(x+2,y+2,0),h=57*scale;poly([a,b,[b[0],b[1]-h],[a[0],a[1]-h]],'#efd7a3','#a58561');poly([b,e,[e[0],e[1]-h],[b[0],b[1]-h]],'#d7b782','#a58561');poly([[a[0],a[1]-h],[b[0],b[1]-h],[b[0]+8*scale,b[1]-h-32*scale],[a[0],a[1]-h-32*scale]],roof,'#874b39');poly([[b[0],b[1]-h],[e[0],e[1]-h],[e[0]+8*scale,e[1]-h-32*scale],[b[0]+8*scale,b[1]-h-32*scale]],'#a64e3c','#874b39');let door=pos(x+1.5,y+2,0);poly([[door[0]-9*scale,door[1]],[door[0]+8*scale,door[1]-8*scale],[door[0]+8*scale,door[1]-33*scale],[door[0]-9*scale,door[1]-24*scale]],'#8b5636')}
function tree(x,y){let p=pos(x+.5,y+.5);ellipse(p[0],p[1],21,7,'#43683b55');ctx.strokeStyle='#75543a';ctx.lineWidth=8*scale;ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(p[0],p[1]-45*scale);ctx.stroke();ellipse(p[0],p[1]-55*scale,24,22,'#427f46');ellipse(p[0]-8*scale,p[1]-66*scale,17,16,'#69a953');ellipse(p[0]+11*scale,p[1]-61*scale,16,17,'#4e9346')}
function person(x,y){let p=pos(x+.5,y+.5);ellipse(p[0],p[1],13,5,'#324a2e66');let bob=Math.sin(t*7)*1.4*scale;poly([[p[0]-8*scale,p[1]-7*scale-bob],[p[0]+8*scale,p[1]-7*scale-bob],[p[0]+10*scale,p[1]-27*scale-bob],[p[0]-10*scale,p[1]-27*scale-bob]],'#3469b2','#25477a');ellipse(p[0],p[1]-38*scale-bob,11,12,'#f5c99d');ellipse(p[0],p[1]-48*scale-bob,12,7,'#70452d');ctx.strokeStyle='#a37a4c';ctx.lineWidth=3*scale;ctx.beginPath();ctx.moveTo(p[0]+10*scale,p[1]-22*scale);ctx.lineTo(p[0]+18*scale,p[1]-44*scale);ctx.stroke()}
const houses=[[2,2,'#bc704c'],[10,3,'#a65d69'],[3,10,'#bd8c45']],trees=[[1,5],[2,7],[1,11],[6,2],[8,1],[12,7],[13,11],[10,12],[6,13],[11,1]],blocked=new Set();for(let [x,y] of houses)for(let i=0;i<2;i++)for(let j=0;j<2;j++)blocked.add(`${x+i},${y+j}`);trees.forEach(([x,y])=>blocked.add(`${x},${y}`));
function render(){t+=.016;ctx.clearRect(0,0,W,H);ctx.fillStyle='#b8d7ad';ctx.fillRect(0,0,W,H);for(let s=0;s<N*2;s++)for(let x=0;x<N;x++){let y=s-x;if(y<0||y>=N)continue;let road=(x===7||y===7||x===8&&y>=4&&y<=10||y===8&&x>=4&&x<=10);diamond(x,y,road?(x+y)%2?'#d6c19a':'#dfcba7':(x+y)%3===0?'#93be76':'#9bc781')}
let things=[];houses.forEach(([x,y,r])=>things.push({z:x+y+2,draw:()=>house(x,y,r)}));trees.forEach(([x,y])=>things.push({z:x+y+.5,draw:()=>tree(x,y)}));things.push({z:hero.x+hero.y+1,draw:()=>person(hero.x,hero.y)}));things.sort((a,b)=>a.z-b.z).forEach(o=>o.draw());
let dx=hero.tx-hero.x,dy=hero.ty-hero.y,dist=Math.hypot(dx,dy);if(dist>.035){let v=Math.min(.065,dist);hero.x+=dx/dist*v;hero.y+=dy/dist*v}else{hero.x=hero.tx;hero.y=hero.ty}requestAnimationFrame(render)}requestAnimationFrame(render);
function move(clientX,clientY){let sx=(clientX-ox)/(T*scale*.5),sy=(clientY-oy)/(T*scale*.255);let x=Math.floor((sx+sy)/2),y=Math.floor((sy-sx)/2);x=Math.max(0,Math.min(N-1,x));y=Math.max(0,Math.min(N-1,y));if(blocked.has(`${x},${y}`)){status.textContent='ตรงนี้มีสิ่งกีดขวาง ลองแตะพื้นที่ว่างครับ';return}hero.tx=x+.0;hero.ty=y+.0;status.textContent=`กำลังเดินไปช่อง ${x+1}, ${y+1}`}c.addEventListener('pointerdown',e=>move(e.clientX,e.clientY));document.getElementById('reset').onclick=()=>{hero.tx=7;hero.ty=8;status.textContent='กลับกลางหมู่บ้าน'};</script></html>
